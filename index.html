<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="An interactive mathematics lab: learn every concept with visuals, playgrounds and tools, organised as a map of what comes before what."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Applied Maths Lab</title>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      try {
        var saved = JSON.parse(localStorage.getItem('aml-progress') || 'null')
        var theme = saved && saved.state && saved.state.settings && saved.state.settings.theme
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
